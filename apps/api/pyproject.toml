[project]
name = "receipt-risk-api"
version = "0.1.0"
description = "Transfer Receipt Risk Engine API"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "Pillow>=11.0",
    "c2pa-python>=0.7",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "rapidocr-onnxruntime>=1.4",
    # POST /v1/receipts/analyze accepts multipart/form-data (docs/API.md
    # §2) -- FastAPI's UploadFile parsing requires this at runtime, not
    # only in tests.
    "python-multipart>=0.0.12",
    # adapters/vision/mobilenet_embedder.py. CPU-only wheels resolved via
    # [tool.uv.sources] below -- the default PyPI wheels bundle CUDA
    # runtime libraries (~800MB+), which is both an unnecessary Railway
    # image-size cost and irrelevant on a CPU-only deployment target
    # (design.md's "cold-start and image size are High risks on Railway").
    "torch>=2.4",
    "torchvision>=0.19",
    # adapters/ocr/field_parsers.py's date scanner: dateutil.parser.parse
    # handles the wide format coverage (numeric/ISO/day-month-name, with or
    # without seconds/timezone) that a hand-rolled parser would duplicate.
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
server = ["uvicorn[standard]>=0.32"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    # scripts/fetch_ocr_models.py's only dependency -- build/CI-time only,
    # never imported by the application itself (the runtime image installs
    # it separately in the Dockerfile's ocr-models stage, before uv sync).
    "requests==2.32.3",
    # FastAPI's TestClient (slice 4 contract/router tests) requires httpx.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipt_risk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# S602/S604/S605/S607 have NO per-file-ignore on purpose: adapters/** is
# exempt from TID251 but must still never reach a shell or a partial-path
# executable (design.md "pyproject.toml — exact additions").
select = ["E", "F", "I", "UP", "B", "TID", "S602", "S604", "S605", "S607"]

# AGENTS.md architecture rule: domain and application code must not import
# FastAPI, PaddleOCR, ExifTool, OpenCV or storage implementations.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "Framework imports are only allowed in adapters/ and bootstrap/."
"starlette".msg = "Framework imports are only allowed in adapters/ and bootstrap/."
"cv2".msg = "OpenCV is an adapter-only dependency."
"paddleocr".msg = "PaddleOCR is an adapter-only dependency."
"PIL".msg = "Pillow is an adapter-only dependency."
"subprocess".msg = "Subprocess execution is adapter-only; fixed argv, shell=False, always a timeout."
"c2pa".msg = "C2PA is an adapter-only dependency."
"onnxruntime".msg = "ONNX Runtime is an adapter-only dependency."
"rapidocr_onnxruntime".msg = "The OCR engine is an adapter-only dependency."
"torch".msg = "PyTorch is an adapter-only dependency (adapters/vision/**)."
"torchvision".msg = "torchvision is an adapter-only dependency (adapters/vision/**)."
"dateutil".msg = "python-dateutil is an adapter-only dependency (adapters/ocr/**)."

[tool.ruff.lint.per-file-ignores]
"src/receipt_risk/adapters/**" = ["TID251"]
"src/receipt_risk/bootstrap/**" = ["TID251"]
"tests/**" = ["TID251"]
"scripts/**" = ["TID251"]
# Note: samples/ lives at the repo root (sibling of apps/), outside this
# project's ruff scan root — it never needs a per-file-ignore here. See
# /samples/generate.py for the fixture-authoring script.
