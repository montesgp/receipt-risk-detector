<!--
  ui-polish round 2, item 2: minimal mark — a receipt (rounded rect + text
  lines) inspected by a magnifying glass, metaphor for "we inspect the
  receipt for risk signals" (deliberately not a checkmark/shield, which
  would read as an authenticity claim this product never makes). A favicon
  file has no access to the page's `[data-theme]` attribute, so it adapts to
  the OS-level `prefers-color-scheme` instead, using the same hex values as
  app.css's `--color-text` / `[data-theme='dark'] --color-text` tokens.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .mark {
      fill: none;
      stroke: #141414;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @media (prefers-color-scheme: dark) {
      .mark {
        stroke: #f3f3f1;
      }
    }
  </style>
  <rect class="mark" x="5" y="4" width="15" height="21" rx="2" />
  <line class="mark" x1="9" y1="10" x2="16" y2="10" />
  <line class="mark" x1="9" y1="14.5" x2="16" y2="14.5" />
  <line class="mark" x1="9" y1="19" x2="13" y2="19" />
  <circle class="mark" cx="22" cy="22" r="5" />
  <line class="mark" x1="25.5" y1="25.5" x2="29" y2="29" />
</svg>
