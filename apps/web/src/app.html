<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // DD3 (design.md): must run synchronously, before body paint, to avoid
      // a flash of the wrong theme — a Svelte component hydrates too late.
      // Mirrors ThemeController's resolution: an explicit `rrd.theme` value
      // wins, otherwise fall back to `prefers-color-scheme` (DESIGN.md §12).
      (function () {
        try {
          var stored = localStorage.getItem('rrd.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          // localStorage/matchMedia unavailable — leave the default light tokens.
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
