name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libimage-exiftool-perl libglib2.0-0
          exiftool -ver

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: ~/.cache/receipt-risk/ocr-models
          key: ocr-models-${{ hashFiles('apps/api/scripts/fetch_ocr_models.py') }}

      - name: Fetch OCR models
        run: uv run python scripts/fetch_ocr_models.py --dest ~/.cache/receipt-risk/ocr-models --verify

      - name: Test
        env:
          RECEIPT_RISK_OCR_MODEL_DIR: ~/.cache/receipt-risk/ocr-models
        run: uv run pytest

  web:
    name: Web Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Test
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npx vitest run
