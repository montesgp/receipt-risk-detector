name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libimage-exiftool-perl libglib2.0-0
          exiftool -ver

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Cache OCR models
        uses: actions/cache@v4
        with:
          path: ~/.cache/receipt-risk/ocr-models
          key: ocr-models-${{ hashFiles('apps/api/scripts/fetch_ocr_models.py') }}

      - name: Fetch OCR models
        run: uv run python scripts/fetch_ocr_models.py --dest ~/.cache/receipt-risk/ocr-models --verify

      - name: Cache vision model
        uses: actions/cache@v4
        with:
          path: ~/.cache/receipt-risk/vision-model
          # Independent cache key from OCR's -- an OCR pin bump must never
          # invalidate the vision cache, and vice versa (design.md "Weight
          # distribution").
          key: vision-model-${{ hashFiles('apps/api/scripts/fetch_vision_model.py') }}

      - name: Fetch vision model
        run: uv run python scripts/fetch_vision_model.py --dest ~/.cache/receipt-risk/vision-model --verify

      - name: Test
        env:
          RECEIPT_RISK_OCR_MODEL_DIR: ~/.cache/receipt-risk/ocr-models
          RECEIPT_RISK_VISION_MODEL_DIR: ~/.cache/receipt-risk/vision-model
        run: uv run pytest

  web:
    name: Web Lint and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        # `svelte-kit sync` generates .svelte-kit/tsconfig.json, which the
        # root tsconfig.json extends. A fresh CI checkout never had `dev`
        # run, so that file doesn't exist yet -- `npm run check` (not a bare
        # svelte-check call) runs sync first, matching package.json's script.
        run: npm run check

      - name: Test
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
        run: npx vitest run

  web-e2e:
    name: Web E2E (Playwright)
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Chromium only, per slice-4 design decision: keeps CI fast, and the
      # suite's own project list (playwright.config.ts) only runs chromium.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        # The suite is fully mocked via route interception (no live
        # apps/api dependency); the opt-in real-API spec is excluded by
        # default via playwright.config.ts's grepInvert (RUN_REAL_API unset).
        env:
          PUBLIC_API_BASE_URL: http://localhost:8000
          CI: 'true'
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
